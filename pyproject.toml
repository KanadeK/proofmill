[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "proofmill"
version = "0.1.0"
description = "Local-first print PDF preflight for self-publishers"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
authors = [
  { name = "KanadeK", email = "121669563+KanadeK@users.noreply.github.com" },
]
keywords = [
  "book-publishing",
  "cli",
  "kdp",
  "pdf",
  "preflight",
  "print",
  "self-publishing",
]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Environment :: Console",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Printing",
  "Topic :: Text Processing",
]
dependencies = [
  "pdfplumber>=0.11.7,<0.12",
  "pypdf>=6.0,<7",
]

[project.optional-dependencies]
dev = [
  "build>=1.3,<2",
  "mypy>=1.17,<3",
  "pip-audit>=2.9,<3",
  "pytest>=9.0.3,<10",
  "pytest-cov>=6.2,<8",
  "reportlab>=4.4,<6",
  "ruff>=0.12,<1",
  "setuptools>=77",
  "wheel",
]

[project.scripts]
proofmill = "proofmill.cli:main"

[project.urls]
Homepage = "https://github.com/KanadeK/proofmill"
Documentation = "https://kanadek.github.io/proofmill/"
Issues = "https://github.com/KanadeK/proofmill/issues"
Repository = "https://github.com/KanadeK/proofmill"

[tool.setuptools]
package-dir = { "" = "src" }
include-package-data = true

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["B", "E", "F", "I", "N", "UP", "W"]

[tool.ruff.lint.per-file-ignores]
"scripts/*.py" = ["T201"]
"scripts/build_docs.py" = ["E501"]
"tests/*.py" = ["S101"]

[tool.mypy]
python_version = "3.11"
strict = true
warn_unused_ignores = true
show_error_codes = true
files = ["src", "scripts"]
mypy_path = ["src", "scripts"]
exclude = ["tests"]

[[tool.mypy.overrides]]
module = ["pdfplumber", "pdfplumber.*", "pypdf", "pypdf.*", "reportlab", "reportlab.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
addopts = "-ra --strict-config --strict-markers"
testpaths = ["tests"]
pythonpath = ["."]

[tool.coverage.run]
branch = true
source = ["proofmill"]

[tool.coverage.report]
fail_under = 90
show_missing = true
skip_covered = true
