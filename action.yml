name: ProofMill print PDF preflight
description: Audit book interior and cover PDFs with a local, sourced KDP paperback profile.
author: KanadeK

branding:
  icon: book-open
  color: green

inputs:
  config:
    description: Path to the ProofMill JSON configuration.
    required: false
    default: proofmill.json
  output-dir:
    description: Directory for deterministic JSON and HTML reports.
    required: false
    default: artifacts/proofmill

runs:
  using: composite
  steps:
    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: "3.12"
        cache: pip
    - name: Install ProofMill
      shell: bash
      run: python -m pip install "$GITHUB_ACTION_PATH"
    - name: Audit print PDFs
      shell: bash
      run: proofmill audit --config "${{ inputs.config }}" --output-dir "${{ inputs.output-dir }}"

