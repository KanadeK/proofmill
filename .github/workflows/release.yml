name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
      - run: uv sync --extra dev --frozen
      - run: uv run python scripts/verify.py
      - run: uv run python scripts/release_check.py --skip-verify
      - name: Verify tag matches package version
        shell: bash
        run: test "$GITHUB_REF_NAME" = "v$(uv run python -c 'import proofmill; print(proofmill.__version__)')"
      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            gh release upload "$GITHUB_REF_NAME" dist/* --clobber
            gh release edit "$GITHUB_REF_NAME" \
              --title "ProofMill $GITHUB_REF_NAME" \
              --notes-file RELEASE_NOTES.md
          else
            gh release create "$GITHUB_REF_NAME" dist/* \
              --verify-tag \
              --title "ProofMill $GITHUB_REF_NAME" \
              --notes-file RELEASE_NOTES.md
          fi
