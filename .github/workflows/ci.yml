name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: Python ${{ matrix.python }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python: ["3.11", "3.13"]
        exclude:
          - os: windows-latest
            python: "3.13"
          - os: macos-latest
            python: "3.11"
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python }}
      - uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
      - run: uv sync --extra dev --frozen
      - run: uv run pytest

  release-gate:
    name: Full release gate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
      - run: uv sync --extra dev --frozen
      - run: uv run python scripts/verify.py
      - uses: actions/upload-artifact@v7
        with:
          name: proofmill-release-evidence
          path: |
            artifacts/
            dist/
            dist-site/
            coverage.xml
          if-no-files-found: error

